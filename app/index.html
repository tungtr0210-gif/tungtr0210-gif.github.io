/* ======================= ĐĂNG BÀI NÂNG CAO (TNG Plus 1.5) ======================= */
const PM_CTA = ['Gửi tin nhắn', 'Mua ngay', 'Tìm hiểu thêm', 'Đặt hàng ngay', 'Liên hệ chúng tôi', 'Gọi ngay', 'Đăng ký', 'Nhận ưu đãi', 'Xem thêm', 'Đặt lịch', 'Tải xuống'];
function pmJ(s, d) { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } }
function pmSpacing(e) { return pmJ(e.spacing, null); }
function pmOffsets(sp, n) {
  if (!sp || !sp.mode || n < 2) return new Array(n).fill(0);
  if (sp.mode === 'random' && Array.isArray(sp.offs) && sp.offs.length === n) return sp.offs;
  const gap = Math.max(PM_MIN_GAP, Number(sp.gap) || 10);
  return Array.from({ length: n }, function (_, i) { return i * gap; });
}
/* Facebook chỉ hẹn giờ được sau ít nhất 10 phút: khi "Đăng ngay", Page thứ 2 lên sau 10 phút, các Page sau vẫn cách nhau ít nhất 5 phút (giống máy chủ). */
const PM_MIN_GAP = 5;
function pmEffective(offs, now) {
  const out = offs.slice();
  for (let i = 1; i < out.length; i++) out[i] = Math.max(out[i], out[i - 1] + PM_MIN_GAP, now ? 10 : 0);
  return out;
}
function pmRandomOffs(n, hours) {
  const win = Math.max(PM_MIN_GAP * (n - 1), hours * 60);
  for (let tries = 0; tries < 200; tries++) {
    const a = [0];
    for (let i = 1; i < n; i++) a.push(Math.round(PM_MIN_GAP + Math.random() * (win - PM_MIN_GAP)));
    a.sort(function (x, y) { return x - y; });
    let okk = true; for (let i = 1; i < n; i++) if (a[i] - a[i - 1] < PM_MIN_GAP) { okk = false; break; }
    if (okk) return a;
  }
  return Array.from({ length: n }, function (_, i) { return i * PM_MIN_GAP; });
}
function pmTimeAt(e, mins) {
  if (!e.time) return '+' + mins + ' phút';
  const t = e.time.split(':'); let m = Number(t[0]) * 60 + Number(t[1]) + mins; const d = Math.floor(m / 1440); m = m % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0') + (d ? ' (+' + d + ' ngày)' : '');
}
function pmSpacingCard(e) {
  const ids = pageIdsOf(e);
  if (ids.length < 2) return '';
  const sp = pmSpacing(e) || { mode: 'even', gap: 10 };

  const offs = pmEffective(pmOffsets(sp, ids.length), now);
  const rows = ids.map(function (id, i) { return '<div class="pm-sch"><span>' + esc(pageNameOf(id)) + '</span><b>' + (now ? (i === 0 ? 'ngay khi duyệt' : offs[i] + ' phút sau khi duyệt') : pmTimeAt(e, offs[i])) + '</b></div>'; }).join('');
  return '<section class="ecard"><div class="ecard-h"><h3>Giãn cách khi đăng ' + ids.length + ' Page <span class="req">*</span></h3><span class="hint" style="margin:0">ít nhất 5 phút một Page để tránh Facebook đánh dấu spam</span></div>' +
    '<div class="pubmodes" role="radiogroup" aria-label="Kiểu giãn cách">' +
    '<label class="radio' + (sp.mode === 'even' ? ' on' : '') + '"><input type="radio" name="pm-mode" value="even"' + (sp.mode === 'even' ? ' checked' : '') + ' data-pm-mode><span><b>Cách đều</b><br><span class="hint" style="margin:0">Mỗi Page cách nhau <select class="select" data-pm-gap style="display:inline-block;width:auto;min-height:30px;padding:2px 8px">' + [5, 10, 15, 30, 60].map(function (g) { return '<option value="' + g + '"' + (Number(sp.gap || 10) === g ? ' selected' : '') + '>' + g + ' phút</option>'; }).join('') + '</select></span></span></label>' +
    '<label class="radio' + (sp.mode === 'random' ? ' on' : '') + '"><input type="radio" name="pm-mode" value="random"' + (sp.mode === 'random' ? ' checked' : '') + ' data-pm-mode><span><b>Rải ngẫu nhiên</b><br><span class="hint" style="margin:0">Trong vòng <select class="select" data-pm-win style="display:inline-block;width:auto;min-height:30px;padding:2px 8px">' + [1, 2, 3, 6].map(function (h) { return '<option value="' + h + '"' + (Number(sp.win || 2) === h ? ' selected' : '') + '>' + h + ' giờ</option>'; }).join('') + '</select>, tối thiểu 5 phút một Page ' + (sp.mode === 'random' ? '<button type="button" class="btn sm" data-act="pmShuffle">Xáo lại</button>' : '') + '</span></span></label></div>' +
    (now ? '<p class="hint" style="margin:8px 0 0">"Đăng ngay": Page đầu lên ngay, Page sau hẹn giờ trên Facebook (Facebook chỉ cho hẹn sau ít nhất 10 phút).</p>' : '') +
    '<div class="pm-schl"><div class="hint" style="margin:0 0 4px">Lịch dự kiến (giờ Thái)</div>' + rows + '</div></section>';

function adDefRules() {

function adRules() {

}
/* ---- số liệu ---- */
function adSum(list) {

  list.forEach(function (m) {
    if (!m) return;
    ['spend', 'impr', 'reach', 'msg', 'buy', 'value', 'cmt', 'v3s', 'p25', 'p50', 'p75'].forEach(function (k) { s[k] += Number(m[k]) || 0; });
    s.link += (m.link !== undefined ? m.link : (m.ctrLink || 0) * (m.impr || 0) / 100);
    s.all += (m.all !== undefined ? m.all : (m.ctr || 0) * (m.impr || 0) / 100);
  });
  s.cpm = s.impr ? s.spend / s.impr * 1000 : 0; s.ctrLink = s.impr ? s.link / s.impr * 100 : 0; s.ctr = s.impr ? s.all / s.impr * 100 : 0; s.freq = s.reach ? s.impr / s.reach : 0;

function adDerive(m) {

    ads: m.value > 0 ? sp / m.value * 100 : null, mess: m.msg > 0 ? sp / m.msg : null, cpm: m.impr > 0 ? (m.cpm || sp / m.impr * 1000) : null, ctr: m.impr > 0 ? m.ctrLink : null,
    cpo: m.buy > 0 ? sp / m.buy : null, close: m.msg > 0 ? m.buy / m.msg * 100 : null, freq: m.freq > 0 ? m.freq : null, hold: m.v3s > 0 ? m.p75 / m.v3s * 100 : null,
    ctrAll: m.impr > 0 ? m.ctr : null, aov: m.buy > 0 ? m.value / m.buy : null

}
function adLvl(c, v) { const x = AD_CRIT[c.k]; return x.low ? (v < c.g ? 2 : v <= c.b ? 1 : 0) : (v > c.g ? 2 : v >= c.b ? 1 : 0); }

function adGrade(m, rules) {

    .map(function (c) { return { k: c.k, v: d[c.k], lvl: adLvl(c, d[c.k]), c: c }; });
  const byAds = items.length && items[0].k === 'ads';
  if ((m.spend || 0) < rules.low.spend) return { label: 'low', items: items, why: 'Chi tiêu ' + adMoney(m.spend) + ' dưới mốc ' + adMoney(rules.low.spend) + ', chưa đủ để đánh giá.' };
  if (byAds && (m.buy || 0) < rules.low.orders && m.spend < rules.low.spendAds) return { label: 'low', items: items, why: 'Mới ' + (m.buy || 0) + ' đơn (dưới ' + rules.low.orders + ') và chi dưới ' + adMoney(rules.low.spendAds) + '.' };
  if (!items.length) return { label: 'low', items: items, why: 'Chưa có số liệu cho các tiêu chí đang bật.' };
  let lvl;
  if (rules.mode === 'any') lvl = Math.max.apply(null, items.map(function (x) { return x.lvl; })) === 2 ? 2 : (items.every(function (x) { return x.lvl === 0; }) ? 0 : 1);
  else if (rules.mode === 'count') { const g = items.filter(function (x) { return x.lvl === 2; }).length, b = items.filter(function (x) { return x.lvl === 0; }).length; lvl = g > items.length / 2 ? 2 : (b > items.length / 2 ? 0 : 1); }
  else lvl = items[0].lvl;

  return { label: label, items: items, why: (noRev ? 'Chưa có doanh thu nên chấm theo giá mess. ' : '') + key.map(adItemText).join(' · ') };

function adFmtV(k, v) {

const V2_PRESETS = [['today', 'Hôm nay'], ['past7', '7 ngày qua'], ['next7', '7 ngày tới'], ['week', 'Tuần này'], ['month', 'Tháng này'], ['lastMonth', 'Tháng trước'], ['all', 'Từ đầu dự án']];
function v2Preset(k) {
  const t = v2Today();

  if (k === 'next7') return { from: t, to: addDays(t, 6) };
  if (k === 'week') { const a = addDays(t, -v2DowI(t)); return { from: a, to: addDays(a, 6) }; }

const V2E = { pageQ: '', tab: 'preview', dev: 'desktop', lib: 'hook', month: '' };
const V2_CTA11 = ['Gửi tin nhắn', 'Mua ngay', 'Tìm hiểu thêm', 'Đặt hàng ngay', 'Liên hệ chúng tôi', 'Gọi ngay', 'Đăng ký', 'Nhận ưu đãi', 'Xem thêm', 'Đặt lịch', 'Tải xuống'];
const V2_MIN_GAP = 10;
function v2Post() { return (S.data.settings || {}).post || { checks: [], slots: ['08:00', '11:00', '18:00'], maxPerDay: 3 }; }
function v2Checks() { return v2Post().checks || []; }
function v2J(s, d) { try { return s ? JSON.parse(s) : d; } catch (e) { return d; } }
/** Thư viện (mục H nạp S.data.library); trước khi nạp thì lấy CTA từ tab HASHTAG & CTA */
function v2Lib() {
  const L = S.data.library || {};
  const own = S.data.options.tags.filter(function (t) { return t.group === 'CTA dự án'; }); // CTA leader thêm ở Cài đặt › Nội dung
  return { hooks: L.hooks || [], ctas: L.ctas ? L.ctas.concat(own) : S.data.options.tags.filter(function (t) { return t.ctaTh || t.tagTh; }) };
}
function v2IsEditOf(e) { return !!(e && e.id); }
function v2AuthorMode(e) {
  if (!e || !e.authorEmail) return v2Mode();
  const u = v2User(e.authorEmail) || {};
  return u.role === 'Leader' ? 'Tự đăng' : (u.mode || 'Cần duyệt');
}
function v2Spacing(e) { return v2J(e.spacing, null) || { mode: 'even', gap: 10 }; }
function v2RandOffs(n, hours) {
  const win = Math.max(V2_MIN_GAP * (n - 1), hours * 60);
  for (let t = 0; t < 300; t++) {
    const a = [0];
    for (let i = 1; i < n; i++) a.push(Math.round(V2_MIN_GAP + Math.random() * (win - V2_MIN_GAP)));
    a.sort(function (x, y) { return x - y; });
    if (a.every(function (v, i) { return !i || v - a[i - 1] >= V2_MIN_GAP; })) return a;
  }
  return Array.from({ length: n }, function (_, i) { return i * V2_MIN_GAP; });
}
function v2Offs(e) {
  const n = pageIdsOf(e).length, sp = v2Spacing(e);
  if (n < 2) return [0];
  const o = sp.mode === 'random' && Array.isArray(sp.offs) && sp.offs.length === n ? sp.offs.slice() : Array.from({ length: n }, function (_, i) { return i * Math.max(V2_MIN_GAP, Number(sp.gap) || 10); });
  // giống máy chủ (core.js effectiveOffsets, MIN_GAP 10): mỗi Page cách Page trước ≥ 10 phút
  for (let i = 1; i < o.length; i++) o[i] = Math.max(o[i], o[i - 1] + V2_MIN_GAP);
  return o;
}

   - Mỗi ~1 giây, nếu bài trong khung soạn đã khác lúc mở, lưu bản tạm trên máy (localStorage, theo dự án + mã bài; bài mới = "new").

function v2jSnap(e) { try { return JSON.stringify(v2Payload(e)); } catch (x) { return ''; } }
function v2jRead(key) {
  try {
    const j = JSON.parse(localStorage.getItem(key) || 'null');
    if (!j || !j.e || Date.now() - (j.at || 0) > V2J_TTL) { if (j) localStorage.removeItem(key); return null; }
    return j;
  } catch (x) { return null; }
}
function v2jWrite(key, e, baseUpd) { try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), e: v2Payload(e), status: e.status || '', baseUpd: baseUpd || '' })); return true; } catch (x) { return false; } }
function v2jDrop(key) { try { localStorage.removeItem(key); } catch (x) { /* bỏ qua */ } }
/* bài mới chỉ đáng giữ khi đã có chữ / file / Page */
function v2jHasContent(e) { return ['contentTh', 'contentVi', 'slogan', 'angle', 'media', 'cta', 'hashtags', 'note', 'pageId', 'adCopy', 'comments'].some(function (k) { return String(e[k] || '').trim(); }); }
function v2jDirty() { const e = S.editing; return !!e && v2jSnap(e) !== V2J.base && (e.id || v2jHasContent(e)); }
/** Ghi ngay bản đang soạn (nếu có thay đổi). Trả về true khi đã lưu tạm. */
function v2jPersist() {
  const e = S.editing; if (!e || !v2jDirty()) return false;
  const p = e.id ? postById(e.id) : null;
  return v2jWrite(v2jKey(e), e, p ? p.updatedAt : '');
}
function v2jStart() {
  V2J.key = S.editing ? v2jKey(S.editing) : '';
  V2J.base = S.editing ? v2jSnap(S.editing) : '';
  V2J.last = V2J.base; V2J.saveReq = false;
}
/* sau khi mở khung soạn: khôi phục bản tạm nếu có */
function v2jRestore() {
  V2J.restored = null;
  const e = S.editing; if (!e) return;
  const key = v2jKey(e), d = v2jRead(key);
  v2jStart();
  if (!d) return;
  const p = e.id ? postById(e.id) : null;
  if (p && d.baseUpd && p.updatedAt && p.updatedAt !== d.baseUpd) {
    // bài đã bị sửa ở nơi khác sau khi lưu tạm: không tự đè, hỏi bằng thanh báo
    V2J.restored = { at: d.at, stale: true, key: key, data: d.e };
    return;
  }
  Object.assign(S.editing, d.e);
  V2J.restored = { at: d.at, key: key };
}
function v2jTime(t) { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + (new Date().toDateString() === d.toDateString() ? '' : ' ngày ' + d.getDate() + '/' + (d.getMonth() + 1)); }

/* thanh báo trong khung soạn */
const v2jEditorHtml0 = v2EditorHtml;
v2EditorHtml = function () {
  const h = v2jEditorHtml0();
  const r = V2J.restored; if (!r || !S.editing) return h;
  const bar = r.stale
    ? '<div class="v2j-bar warn" role="status"><span>Có bản đang viết dở lưu lúc <b>' + v2jTime(r.at) + '</b>, nhưng bài đã được sửa ở nơi khác sau đó.</span><span class="v2j-act"><button type="button" class="btn sm" data-act="v2jUse">Dùng bản viết dở</button><button type="button" class="btn sm" data-act="v2jDiscard">Bỏ bản viết dở</button></span></div>'
    : '<div class="v2j-bar" role="status"><span>Đã khôi phục bài đang viết dở (lưu tạm lúc <b>' + v2jTime(r.at) + '</b>).</span><span class="v2j-act"><button type="button" class="btn sm" data-act="v2jDiscard">' + (S.editing.id ? 'Bỏ thay đổi, dùng bản đã lưu' : 'Bỏ, viết bài mới') + '</button><button type="button" class="icon-btn" data-act="v2jHide" aria-label="Ẩn thông báo">✕</button></span></div>';
  return h.replace('<div class="v2dr-l">', '<div class="v2dr-l">' + bar);
};
ACT.v2jHide = function () { V2J.restored = null; renderDrawer(); };
ACT.v2jUse = function () { const r = V2J.restored; if (!r || !S.editing) return; Object.assign(S.editing, r.data); V2J.restored = { at: r.at, key: r.key }; V2J.base = ''; renderDrawer(); };
ACT.v2jDiscard = function () {
  const r = V2J.restored; if (r) v2jDrop(r.key);
  V2J.restored = null;
  if (!S.editing) return;
  if (S.editing.id) { const p = postById(S.editing.id); if (p) S.editing = Object.assign({}, p); }
  else S.editing = newDraft();
  v2jStart(); renderDrawer();
};

/* mở khung soạn */
const v2jNew0 = ACT.new;
ACT.new = function (el, ev) { v2jPersist(); v2jNew0(el, ev); v2jRestore(); if (V2J.restored) renderDrawer(); };
const v2jEdit0 = ACT.edit;
ACT.edit = function (el, ev) { v2jPersist(); v2jEdit0(el, ev); v2jRestore(); if (V2J.restored) renderDrawer(); };
/* đóng khung soạn: giữ bản đang viết */
function v2jOnLeave() {
  if (!S.editing) return;
  const isNew = !S.editing.id;
  if (v2jPersist()) toast(isNew ? 'Đã lưu tạm bài đang viết. Bấm "Viết bài mới" để viết tiếp.' : 'Đã lưu tạm thay đổi. Mở "Sửa" bài này để viết tiếp.');
  V2J.key = ''; V2J.restored = null;
}
const v2jClose0 = ACT.close;
ACT.close = function (el, ev) { if (S.editing && !S.uploading) v2jOnLeave(); v2jClose0(el, ev); };
/* lưu nháp / gửi duyệt: thành công thì xóa bản tạm */
const v2jSave0 = v2Save;
v2Save = function (submit) { V2J.saveReq = true; v2jPersist(); v2jSave0(submit); };

/* theo dõi liên tục */
setInterval(function () {
  const e = S.editing;
  if (e) {
    const key = v2jKey(e);
    if (key !== V2J.key && V2J.key && !e.id && V2J.key.slice(-4) === ':new') { v2jDrop(V2J.key); } // bài mới vừa được lưu → có mã bài
    if (key !== V2J.key) { V2J.key = key; }
    if (V2J.saveReq && !S.busy) V2J.saveReq = false; // lưu lỗi: còn mở khung, giữ bản tạm
    const s = v2jSnap(e);
    if (s !== V2J.last) { V2J.last = s; v2jPersist(); }
  } else if (V2J.key) {
    if (V2J.saveReq) { v2jDrop(V2J.key); v2jDrop(V2J.key.replace(/:[^:]*$/, ':new')); }
    V2J.key = ''; V2J.saveReq = false; V2J.restored = null;
  }
}, 1000);
/* tắt app / tải lại trang khi đang viết */
window.addEventListener('beforeunload', function () { v2jPersist(); });
/* bài mới lưu thành công: upsert trả về bài có mã → bỏ bản tạm "new" */
const v2jUpsert0 = upsert;
upsert = function (p) { const r = v2jUpsert0.apply(this, arguments); if (V2J.saveReq && p && p.id) { v2jDrop(v2jKey({ id: p.id })); v2jDrop(v2jKey({ id: '' })); } return r; };

/* bôi chữ trong ô rồi kéo chuột ra ngoài khung: không coi là bấm ra ngoài (chỉ đóng khi bấm xuống VÀ nhả chuột đều ở vùng tối) */
let v2jDownOnOverlay = false;
document.addEventListener('mousedown', function (ev) { v2jDownOnOverlay = !!(ev.target && ev.target.classList && ev.target.classList.contains('overlay')); }, true);
const v2jCloseOv0 = ACT.closeOverlay;
ACT.closeOverlay = function (el, ev) { if (ev && ev.target === el && !v2jDownOnOverlay) return; v2jCloseOv0(el, ev); };

(function () {
  const css = document.createElement('style');
  css.textContent = '.v2j-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid var(--info-line, #BBD0FF);background:var(--info-bg, #EDF2FF);color:var(--info-ink, #23408E);border-radius:12px;padding:10px 14px;font-size:13.5px}' +
    '.v2sum .v2warn{display:block;margin-top:6px;color:var(--warn-ink, #7A4B00);font-weight:600}' +
    '.v2j-bar.warn{border-color:var(--warn-line, #F5D28A);background:var(--warn-bg, #FFF7E0);color:var(--warn-ink, #7A4B00)}.v2j-act{display:flex;gap:6px;align-items:center}';
  document.head.appendChild(css);
})();

/* ======================= TNG Plus 2.1 · M. Giao diện điện thoại (≤ 760px) =======================
   Dùng chung cho app máy tính (cửa sổ hẹp) và bản web trên điện thoại:
   thanh bên → thanh menu dưới đáy · trang 1 cột · khung viết bài toàn màn hình · bảng cuộn ngang · hộp thoại vừa màn hình. */
(function () {
  const css = document.createElement('style');
  css.textContent = '@media (max-width:760px){' +
    /* khung chung */
    'html,body{overflow-x:hidden}.tg-app{min-height:100dvh}' +
    '.tg-bar{padding:6px 8px 0;gap:2px}.tg-tab{max-width:150px;padding:0 10px 0 6px}.tg-plus{display:none}' +
    '.tg-shell{display:block}.tg-main{padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px));min-width:0}' +
    /* thanh bên → menu dưới đáy */
    '.tg-side,.tg-side.mini,.tg-side:not(.mini){position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;z-index:60;flex-direction:row;align-items:stretch;gap:0;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--panel);box-shadow:0 -6px 18px rgba(0,0,0,.06)}' +
    'body:has(#drawer-root .overlay) .tg-side,body:has(#modal-root .modal-wrap) .tg-side{display:none!important}' +
    '.tg-side .brand,.tg-side .statuscard,.tg-side>.tg-icon,.tg-side .tg-ava,.tg-side>span[style]{display:none!important}' +
    '.tg-side .tg-navs{flex-direction:row;flex:1;justify-content:space-around;gap:2px}' +
    '.tg-side .tg-nav,.tg-side.mini .tg-nav{flex:1;width:auto;height:auto;flex-direction:column;gap:2px;padding:6px 2px;justify-content:center;font-size:11px;position:relative;text-align:center}' +
    '.tg-side .tg-nl,.tg-side.mini .tg-nl{display:block;font-size:11px}.tg-side .tg-badge,.tg-side.mini .tg-badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0;font-size:9.5px;padding:0 5px}' +
    /* thanh phụ Tổng quan / Bài viết / Duyệt */
    '.tg-sub{margin:0 0 12px;padding-bottom:10px;gap:8px}.tg-subtabs{width:100%;overflow-x:auto}.tg-subtabs button{flex:1;justify-content:center;padding:8px 6px;white-space:nowrap}' +
    '.tg-pick{width:100%}.tg-pick .viewcard{width:100%;padding:4px 6px}.tg-pick .vc-l{display:none}.tg-pick .pagepick{min-width:0;flex:1}' +
    /* tiêu đề trang + nút */
    '.topbar,.v2head{flex-direction:column;align-items:stretch!important;gap:10px}.topbar h1,.v2head h1{font-size:23px}.topbar .actions,.v2head .v2row,.v2head .actions{flex-wrap:wrap;gap:8px}.topbar .btn,.v2head .btn{flex:1 1 auto}' +
    /* thẻ số liệu, lưới */
    '.kpis,.v2kpis,.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.kpi{padding:14px 14px}.kpi-n{font-size:28px}' +
    '.grid,.v2g2,.v2g3,.split{grid-template-columns:1fr!important}' +
    '.scroll,.v2scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}table{font-size:12.5px}' +
    /* Duyệt & đăng: mỗi bài 1 cột, xem trước Facebook xuống dưới */
    '.v2qi{grid-template-columns:1fr!important;display:flex;flex-direction:column}.v2qi-r{max-width:100%}.v2qi-r .fb{max-width:100%}.v2qi .v2row{flex-wrap:wrap}.v2qi .v2row .btn{flex:1 1 auto}' +
    '.v2slots{grid-template-columns:repeat(2,minmax(0,1fr))!important;overflow-x:auto}' +
    '.v2rf-2{grid-template-columns:1fr!important}.v2score{flex-wrap:wrap}' +
    /* khung viết bài toàn màn hình */
    '.overlay.v2ov{padding:0}.v2drawer{width:100%!important;max-width:100%!important;border-radius:0}' +
    '.v2dr-h{padding:10px 12px}.v2dr-h h2{font-size:18px}' +
    '.v2dr-b{display:flex!important;flex-direction:column;padding:12px;gap:12px}.v2dr-l{order:1}.v2dr-r{order:2;position:static!important;max-height:none!important;overflow:visible!important}' +
    '.v2blk{padding:14px}.v2cards3{grid-template-columns:1fr!important}.v2pgl{max-height:260px}' +
    '.v2dr-f{flex-wrap:wrap;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}.v2dr-f>.hint,.v2dr-f>span[style]{display:none}.v2dr-f .btn{flex:1 1 30%;min-height:44px}.v2dr-f .btn.primary{flex:1 1 100%;order:3}' +
    '.v2dpop,.v2tpop{position:fixed!important;left:8px!important;right:8px!important;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom,0px))!important;width:auto!important;max-height:70vh;overflow:auto;z-index:300}' +
    /* chi tiết bài (drawer cũ), hộp thoại */
    '.drawer{width:100%!important;max-width:100%!important}.drawer-b{padding:12px}.drawer-f{flex-wrap:wrap}' +
    '.modal-wrap{padding:8px;align-items:flex-end}.modal{width:100%!important;max-width:100%!important;max-height:88vh;overflow:auto;border-radius:16px 16px 10px 10px}' +
    /* Cài đặt: menu nhóm thành hàng cuộn ngang */
    '.set-wrap{grid-template-columns:1fr!important;gap:12px}.set-nav{position:static!important;flex-direction:row!important;overflow-x:auto;gap:4px;padding-bottom:4px}.set-nav button{white-space:nowrap;flex:none}' +
    '.v2ut{min-width:760px}.set-row{flex-direction:column;align-items:stretch}' +
    /* thông báo, thẻ đăng nền */
    '.v2toast,.toast{left:12px!important;right:12px!important;bottom:calc(76px + env(safe-area-inset-bottom,0px))!important;max-width:none!important}' +
    '.bg-pill{right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px))}' +
    '.fb{max-width:100%}.pv-desktop .fb,.v2pv.desktop .fb{max-width:100%}' +
    '}';
  document.head.appendChild(css);
})();


/* ======================= KHỞI ĐỘNG ======================= */
api('api_bootstrap').then(function (data) {
  if (data.denied) {
    document.getElementById('app').innerHTML = '<div class="center"><div class="logo">HC</div><h1 style="margin:0;font-size:20px;color:var(--ink)">Bạn chưa có quyền vào app</h1><p style="margin:0">Gửi email <b>' + esc(data.me.email) + '</b> cho leader để được thêm vào.</p><a class="btn" href="#" data-act="logout">Đăng nhập bằng tài khoản khác</a></div>';
    return;
  }
  S.data = data;
  S.syncedAt = nowHM();
  if (data.me.isLeader && (data.posts.some(function (p) { return p.status === 'Chờ duyệt'; }))) S.view = 'queue';
  renderAll();
}).catch(function (e) {
  document.getElementById('app').innerHTML = '<div class="center"><h1 style="margin:0;font-size:20px;color:var(--ink)">Không mở được app</h1><p style="margin:0;max-width:520px">' + esc(e.message) + '</p></div>';
});
</script>
