<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="tng-web.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TNG Plus</title>
<meta name="theme-color" content="#141413">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F5; --panel:#FFFFFF; --side:#FAFAF8; --line:#E7E6E2; --line2:#D9D8D3;
  --soft:#FAFAF8; --soft2:#F4F4F1; --hover:#EFEFEB;
  --ink:#1C1C1A; --ink2:#55554F; --ink3:#6E6E67; --accent:#2F4FD6; --accent-ink:#FFFFFF; --accent-soft:#EDF2FF;
  --blue:#2F4FD6; --danger:#B42318; --radius:12px;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --thai:'Noto Sans Thai','Be Vietnam Pro',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.th{font-family:var(--thai)}

/* layout */
.shell{display:flex;min-height:100vh}
.side{width:268px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:40px;height:40px;border-radius:10px;background:#141413;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.brand b{display:block;font-size:16px}
.brand span{font-size:13px;color:var(--ink3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:12px;cursor:pointer;color:var(--ink2);font-size:16px;min-height:48px}
.nav button:hover{background:var(--hover)}
.nav button.on{background:#EBEBE6;color:var(--ink);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.nav .soon{margin-left:auto;font-size:10px;font-weight:600;color:var(--ink3);border:1px solid var(--line2);border-radius:999px;padding:0 6px}
.me{margin-top:auto;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.me b{font-size:14px}
.me span{font-size:12px;color:var(--ink3);word-break:break-all}
.main{flex:1;min-width:0;padding:36px 44px 60px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.topbar h1{font-size:30px;margin:0;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.topbar p{margin:4px 0 0;color:var(--ink3);font-size:16px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--hover)}
a.btn{color:var(--ink);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover,.btn.blue:hover{background:#2440B8}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--danger);border-color:#F1C5C0}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.input,.select,textarea.input{width:100%;border:1px solid var(--line2);border-radius:10px;background:var(--panel);padding:9px 12px;min-height:44px}
textarea.input{min-height:96px;resize:vertical;line-height:1.55}
.input:focus,.select:focus,textarea.input:focus{outline:2px solid #BAC8FF;border-color:var(--accent)}
label.lab{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink2)}
.req{color:var(--danger)}
.hint{font-size:12px;color:var(--ink3);margin-top:6px}
.field{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:34px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.th{font-family:var(--thai)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:16px;margin:0;display:flex;align-items:center;gap:6px}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .n{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile .l{font-size:13px;color:var(--ink3);margin-top:4px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block;flex:none}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.two>*,.grid>*,.split>*{min-width:0}
.empty{padding:28px 18px;text-align:center;color:var(--ink3)}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-draft{background:#FFEDD5;color:#9A3412}
.st-pending{background:#FEF3C7;color:#854D0E}
.st-revise{background:#FEE2E2;color:#991B1B}
.st-approved{background:#DCFCE7;color:#166534}
.st-scheduled{background:#EDE9FE;color:#5B21B6}
.st-posted{background:#DBEAFE;color:#1E40AF}
.st-failed{background:#991B1B;color:#fff}

/* table/list */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.filters .input,.filters .select{width:auto;min-width:150px;flex:1 1 150px}
.list{display:flex;flex-direction:column}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:118px 150px minmax(0,1fr) 140px 120px;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer;width:100%}
.row:first-child{border-top:none}
.row:hover{background:#FAFAF7}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row .when b{display:block;font-size:14px}
.row .when span{font-size:12px;color:var(--ink3)}
.row .page{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ttl{min-width:0}
.row .ttl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.row .ttl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--ink3)}
.row .who{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-head{display:grid;grid-template-columns:118px 150px minmax(0,1fr) 140px 120px;gap:14px;padding:10px 18px;font-size:12px;font-weight:600;color:var(--ink3);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.03em}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:12px;color:var(--ink3);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
table.rep{font-size:15.5px}
table.rep th{font-size:13px;padding:14px 9px;white-space:nowrap;background:#FCFCFB}
table.rep td{padding:14px 9px}
.rep-h{padding:20px 24px}
.rep-h h2{font-size:18px}
th .h{display:inline-flex;align-items:center;gap:5px}
th.num .h{justify-content:flex-end}
.th-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;color:inherit;border-radius:4px}
.th-btn:focus-visible{outline:2px solid var(--accent)}
.sorter{color:#9A9A93}
.sorter.on{color:var(--accent)}
.tip{display:inline-flex;color:#9A9A93;cursor:help}
.caret{all:unset;cursor:pointer;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--ink3);transition:transform .15s}
.caret:hover{background:var(--hover)}
.caret.open{transform:rotate(90deg)}
.caret:focus-visible{outline:2px solid var(--accent)}
.tag-soft{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px;margin-left:8px}
tr.zero td{color:#A3A39C}
tr.sub>td{background:var(--soft);padding:0}
tr.sub .list{border-left:3px solid var(--accent-soft)}
.link{color:var(--accent);font-weight:600;text-decoration:none;font-size:16px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}
.bar{height:6px;border-radius:999px;background:#ECECE7;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.who-cell{display:flex;align-items:center;gap:10px}
.av.solo{margin:0;border:none;width:34px;height:34px;font-size:12px}
.viewcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;position:relative}
.vc-l{font-size:14px;font-weight:600;color:var(--ink2);margin:2px 0 10px 2px}
.pagepick{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:60px}
.pagepick:hover{background:var(--soft)}
.pagepick:focus-visible{outline:2px solid var(--accent)}
.pp-t{flex:1;min-width:0}
.pp-t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-t span{font-size:12.5px;color:var(--ink3);line-height:1.35;display:block}
.avs{display:flex;padding-left:8px;flex:none}
.av{width:32px;height:32px;border-radius:999px;border:2px solid #fff;margin-left:-8px;background:#1C1C1A;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.av:nth-child(2){background:#6B6E76}
.av.more{background:#2B2B29}
.pmenu{position:absolute;left:10px;right:10px;top:calc(100% - 4px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.14);padding:6px;z-index:30;max-height:340px;overflow:auto}
.pmenu button{all:unset;box-sizing:border-box;display:block;width:100%;padding:9px 10px;border-radius:8px;cursor:pointer}
.pmenu button:hover,.pmenu button.on{background:#F1F1EE}
.pmenu button:focus-visible{outline:2px solid var(--accent)}
.pmenu b{display:block;font-size:14px}
.pmenu span{font-size:12px;color:var(--ink3)}
.statuscard{margin-top:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.statuscard div{display:flex;align-items:center;gap:9px;font-size:15px}
.statuscard>span{display:block;font-size:13px;color:var(--ink3);margin-top:2px}
.statuscard a{font-size:13px;color:var(--ink3)}
.banner{border-radius:14px;padding:16px 20px;margin-bottom:16px;font-size:15px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.banner.warn{background:#FFF4E6;border:1px solid #FFE3C2;color:#B4540A}
.banner.info{background:#EDF2FF;border:1px solid #DBE4FF;color:#2F4AC8}
.banner .btn{background:var(--panel);border-color:#FFD8A8;color:#B4540A}
.seg{display:inline-flex;background:#ECECE7;border-radius:11px;padding:3px;gap:2px}
.seg button{all:unset;box-sizing:border-box;padding:8px 16px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;color:var(--ink2)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.sheet-wrap{overflow:auto;max-height:calc(100vh - 290px);min-height:320px}
table.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px}
table.sheet th{position:sticky;top:0;z-index:2;background:#F1EFEA;text-align:left;font-size:12.5px;font-weight:700;color:var(--ink2);padding:12px 10px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.sheet td{background:var(--band,#fff);padding:10px;border-bottom:1px solid #E6E2DC;border-right:1px solid #EEEBE6;vertical-align:top;line-height:1.45}
table.sheet tr{cursor:pointer}
table.sheet tbody tr:hover td{background:#EEF2FF}
table.sheet tbody tr:focus-visible td{outline:2px solid var(--accent);outline-offset:-2px}
table.sheet .stick{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line2)}
table.sheet th.stick{z-index:3}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.clamp.strong{font-weight:600}
.muted{color:#A3A39C}
.pill-soft{display:inline-block;white-space:nowrap;background:rgba(255,255,255,.75);border:1px solid #E0DDD6;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;color:var(--ink2)}
.mini-thumbs{display:flex;gap:4px}
.mt{width:34px;height:34px;border-radius:6px;background:#E4E2DC;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink2)}
.mt img{width:100%;height:100%;object-fit:cover}
.ads-on{display:inline-flex;width:22px;height:22px;border-radius:5px;background:var(--accent);color:#fff;align-items:center;justify-content:center}
.ads-off{display:inline-block;width:20px;height:20px;border-radius:5px;border:1.5px solid #B9B6AE;background:var(--panel)}
.peek{position:fixed;z-index:50;background:var(--panel);border:2px solid var(--accent);border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:10px 12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:min(60vh,440px);overflow:auto;cursor:pointer;color:var(--ink)}
.peek[hidden]{display:none}
.peek.th{font-family:var(--thai)}
.peek.strong{font-weight:600}
.peek::after{content:'Bấm để mở chi tiết';display:block;margin-top:8px;font-size:11.5px;color:var(--ink3);font-weight:400;font-family:var(--font);white-space:normal}
.ppick{display:flex;flex-direction:column;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:#1E3A8A;border:1px solid #C7D2FE;border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600}
.pchip button{border:0;background:transparent;color:inherit;width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.pchip button:hover{background:rgba(47,79,214,.12)}
.plist{max-height:220px;overflow:auto;border:1px solid var(--line2);border-radius:10px;background:var(--panel);padding:4px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.pitem:hover{background:var(--soft2)}
.pitem input,.selbox input,td>input[type=checkbox],th>input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.selbox{display:inline-flex;align-items:center;margin-right:6px;vertical-align:middle;cursor:pointer}
.bulkbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#EEF2FF;border:1px solid #C7D2FE;border-radius:12px;padding:10px 14px;margin-bottom:12px;color:#1E3A8A}
.cm-row{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.cm-head{display:flex;justify-content:space-between;align-items:center}
.cm-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cm-tools .select{width:auto;flex:1 1 220px;min-width:0}
.thumb.sm{width:56px;height:56px}
.fb-cm{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid #E4E6EB;margin:0 12px;padding-left:0;padding-right:0}
.fb-c{display:flex;gap:8px;align-items:flex-start}
.fb-av.sm{width:30px;height:30px;font-size:10px}
.fb-bub{background:#F0F2F5;border-radius:14px;padding:8px 12px;font-size:13.5px;line-height:1.5;min-width:0;max-width:calc(100% - 40px)}
.fb-bub b{font-family:var(--font);font-size:12.5px;display:block}
.fb-bub .cimg{margin-top:6px;width:160px;max-width:100%;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#E4E6EB;position:relative}
.fb-bub .cimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eform{display:flex;flex-direction:column;gap:14px;min-width:0}
.ecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ecard-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ecard-h h3{margin:0;font-size:16px}
.ecard .sec-title{display:none}
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:8px}
.mthumb{width:56px;height:56px;border-radius:8px;background:#ECECE7;position:relative;overflow:hidden;flex:none}
.mthumb img{width:100%;height:100%;object-fit:cover}
.mplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.25)}
.mmeta{flex:1;min-width:0}
.mmeta b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mmeta span{font-size:12.5px;color:var(--ink3)}
.icon-btn.bordered{border:1px solid var(--line2);width:38px;height:38px}
.pubmodes{display:flex;flex-direction:column;gap:8px}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pv-mobile .fb{max-width:360px;margin:0 auto;border-radius:22px;box-shadow:0 0 0 8px #1C1C1A}
.vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff}
.vplay svg{width:56px;height:56px;padding:14px;border-radius:999px;background:rgba(0,0,0,.45);box-sizing:border-box}
.fb-video{background:#000;display:flex;justify-content:center}
.fb-video video{display:block;width:100%;max-height:560px;background:#000}
.fb-video iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.fb-video.tall iframe{width:min(100%,315px);aspect-ratio:9/16}
.vbtn{border:0;padding:0;width:100%;cursor:pointer;font:inherit}
.vbtn:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.modal.wide{width:min(640px,100%)}
.tv-wrap{background:#000;border-radius:10px;overflow:hidden;display:flex;justify-content:center}
.tv-wrap video{max-width:100%;max-height:300px;display:block}
.tv-strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.tv-frame{border:2px solid transparent;border-radius:6px;padding:0;background:none;cursor:pointer;flex:none}
.tv-frame:hover,.tv-frame:focus-visible{border-color:var(--accent);outline:none}
.tv-frame canvas{display:block;border-radius:4px}
.tv-up{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.tv-cur{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tv-cur img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:24px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 26px}
.kpi-l{font-size:16px;color:var(--ink2)}
.kpi-n{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:8px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.kpi-n.long{font-size:clamp(22px,2.1vw,30px)}
.kpi-s{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:0}
.kpi-sub{font-size:14px;color:var(--ink3);margin-top:10px}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.progress{height:6px;border-radius:999px;background:#ECECE7;overflow:hidden;width:160px}
.progress i{display:block;height:100%;background:var(--accent)}

/* queue */
.qcard{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0;border-bottom:1px solid var(--line)}
.qcard:last-child{border-bottom:none}
.qinfo{padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.qprev{padding:16px 18px;background:var(--soft2);border-left:1px solid var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{padding:8px 10px;font-size:12px;font-weight:600;color:var(--ink3);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}
.cal .day{min-height:112px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .day.out{background:var(--soft)}
.cal .day.out .dn{color:#B5B5AE}
.cal .day.today .dn{background:var(--accent);color:#fff}
.cal .dn{font-size:12px;font-weight:600;width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.pill{border:0;margin:0;font:inherit;text-align:left;box-sizing:border-box;display:block;font-size:11.5px;padding:3px 7px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;width:100%}
.pill:focus-visible{outline:2px solid var(--accent)}
.more{font-size:11px;color:var(--ink3);padding-left:4px}
.agenda{display:none}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(20,20,19,.38);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(1080px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.drawer-h{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:17px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{all:unset;box-sizing:border-box;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:var(--hover)}
.icon-btn:focus-visible{outline:2px solid var(--accent)}
.drawer-b{flex:1;overflow:auto;padding:20px}
.drawer-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 20px;background:var(--panel);border-top:1px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form .full{grid-column:1/-1}
.sticky{position:sticky;top:0}
.sec-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin:6px 0 -4px}
.topic-help{background:var(--soft2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.topic-help b{color:var(--ink)}

/* media */
.media{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;background:#ECECE7;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink3);text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:999px;border:none;background:rgba(20,20,19,.72);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* fb preview */
.fb{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--thai)}
.fb-h{display:flex;gap:10px;align-items:center;padding:12px 14px 6px}
.fb-av{width:40px;height:40px;border-radius:999px;background:#141413;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:var(--font);flex:none}
.fb-h b{display:block;font-size:14px;font-family:var(--font)}
.fb-h span{font-size:12px;color:#65676B;font-family:var(--font)}
.fb-msg{padding:6px 14px 12px;white-space:pre-wrap;font-size:14.5px;line-height:1.6;word-break:break-word}
.fb-msg .tag{color:#1B4DB1}
.fb-msg .slogan{font-weight:600}
.fb-img{display:grid;gap:2px;background:var(--panel)}
.fb-img.n1{grid-template-columns:1fr}
.fb-img.n2{grid-template-columns:1fr 1fr}
.fb-img.n3{grid-template-columns:1fr 1fr}
.fb-img.n3 > :first-child{grid-column:1/-1}
.fb-img.n4{grid-template-columns:1fr 1fr}
.fb-img .ph{aspect-ratio:1/1;background:#E4E6EB;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#65676B;font-size:12px;font-family:var(--font)}
.fb-img.n1 .ph{aspect-ratio:4/5}
.fb-img .ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.fb-img .ph .plus{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center}
.fb-f{display:flex;justify-content:space-around;border-top:1px solid #E4E6EB;margin:0 12px;padding:8px 0;color:#65676B;font-size:13px;font-family:var(--font)}

.box{border-radius:10px;padding:12px 14px;font-size:13.5px}
.box.review{background:#FFF7ED;border:1px solid #FED7AA}
.box.error{background:#FEF2F2;border:1px solid #FECACA;color:#7F1D1D}
.box.info{background:var(--accent-soft);border:1px solid #BCDCDF;color:#0B3F48}
.box b{display:block;margin-bottom:2px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kv div span{display:block;font-size:12px;color:var(--ink3)}
.kv div b{font-size:14px;font-weight:600}

/* modal & toast */
.modal-wrap{position:fixed;inset:0;background:rgba(20,20,19,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border-radius:14px;width:min(520px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h3{margin:0;font-size:17px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:10px;padding:12px;cursor:pointer}
.radio.on{border-color:var(--accent);background:var(--accent-soft)}
.radio input{margin-top:3px}
.toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100% - 32px))}
.toast{background:#1C1C1A;color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);width:100%}
.toast.err{background:#7F1D1D}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:999px;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--ink2);padding:24px;text-align:center}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.switch input{width:18px;height:18px;accent-color:var(--accent)}

@media (max-width: 1100px){
  .split{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .qcard{grid-template-columns:minmax(0,1fr)}
  .qprev{border-left:none;border-top:1px solid var(--line)}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 820px){
  .shell{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand span,.statuscard,.vc-l{display:none}
  .viewcard{padding:0;border:none;background:none;flex:none}
  .pagepick{min-height:44px;padding:6px 10px;width:auto}
  .pp-t span{display:none}
  .pp-t b{max-width:120px}
  .pmenu{position:fixed;left:12px;right:12px;top:64px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
  .kpi{padding:16px}
  .kpi-l{font-size:14px}
  .kpi-sub{font-size:12.5px}
  .kpi-n{font-size:28px}
  .rep-h{flex-wrap:wrap;padding:16px}
  .rep-h h2{font-size:16px}
  .topbar h1{font-size:24px}
  .topbar p{font-size:14px}
  .nav{flex-direction:row;gap:4px}
  .nav button{padding:8px 12px;font-size:14px;white-space:nowrap}
  .nav button .lbl-long{display:none}
  .main{padding:16px 16px 60px}
  .list-head{display:none}
  .row{grid-template-columns:1fr auto;gap:4px 10px;padding:12px 16px}
  .row .when{grid-column:1;grid-row:1}
  .row .stc{grid-column:2;grid-row:1;justify-self:end}
  .row .ttl{grid-column:1/-1}
  .row .page,.row .who{grid-column:1/-1;font-size:12px}
  .form{grid-template-columns:minmax(0,1fr)}
  .row.mini .ttl{grid-column:1;grid-row:1}
  .drawer-b{padding:14px}
  .cal{display:none}
  .agenda{display:block}
  .filters .input,.filters .select{min-width:0;flex:1 1 140px}
}
</style>

<body>
<div id="app"><div class="center"><span class="spin" aria-hidden="true"></span><span>Đang tải…</span></div></div>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div class="toast-root" id="toast-root" role="status" aria-live="polite"></div>
<script>
/* ======================= DỮ LIỆU & GỌI SERVER ======================= */
const S = {
  data: null, view: 'overview', openId: null, editing: null, busy: '', logs: null,
  filters: { month: monthOf(todayTH()), author: '', page: '', status: '', q: '', range: 'next7' },
  pageView: '', pageMenu: false, sel: {}, selPages: {}, pageSearch: '', pageFilter: '', sort: { key: 'date', dir: 1 }, expanded: {}, syncedAt: '',
  calMonth: monthOf(todayTH()), uploading: '', modal: null
};
const ST_CLASS = { 'Đang làm': 'draft', 'Chờ duyệt': 'pending', 'Cần sửa': 'revise', 'Đã duyệt': 'approved', 'Đã hẹn giờ': 'scheduled', 'Đã đăng': 'posted', 'Lỗi đăng': 'failed' };
const ST_DOT = { draft: '#EA580C', pending: '#CA8A04', revise: '#DC2626', approved: '#16A34A', scheduled: '#7C3AED', posted: '#2563EB', failed: '#991B1B' };
const ST_ORDER = ['Đang làm', 'Cần sửa', 'Chờ duyệt', 'Đã duyệt', 'Lỗi đăng', 'Đã hẹn giờ', 'Đã đăng'];

/* Gọi máy chủ: api('api_savePost', post) giống google.script.run của bản Apps Script */
function api(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return fetch('/api/' + fn, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ args: args }) })
    .then(function (r) {
      if (r.status === 401) { location.href = '/login'; throw new Error('Phiên đăng nhập đã hết hạn.'); }
      return r.json().catch(function () { throw new Error('Máy chủ trả lời không đúng (mã ' + r.status + ').'); });
    }, function () { throw new Error('Mất kết nối tới máy chủ. Kiểm tra mạng rồi thử lại.'); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Có lỗi.'); return j.result; });
}

/* Tải 1 file lên máy chủ, có % tiến độ. kind = 'image' cho ảnh bình luận / ảnh thu nhỏ. */
function uploadFile(file, name, kind, onProgress) {
  return new Promise(function (resolve, reject) {
    const fd = new FormData();
    fd.append('file', file, name || file.name || 'file');
    const x = new XMLHttpRequest();
    x.open('POST', '/upload' + (kind ? '?kind=' + kind : ''));
    x.upload.onprogress = function (ev) { if (ev.lengthComputable && onProgress) onProgress(Math.floor(ev.loaded / ev.total * 100)); };
    x.onload = function () {
      if (x.status === 401) { location.href = '/login'; return reject(new Error('Phiên đăng nhập đã hết hạn.')); }
      let j = {}; try { j = JSON.parse(x.responseText); } catch (e) { j = { ok: false, error: 'Máy chủ trả lời không đúng (mã ' + x.status + ').' }; }
      j.ok ? resolve(j.result) : reject(new Error(j.error || 'Tải lên lỗi.'));
    };
    x.onerror = function () { reject(new Error('Mất kết nối khi tải lên.')); };
    x.send(fd);
  });
}

function todayTH() { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10); }
function monthOf(d) { return String(d || '').slice(0, 7); }
function addDays(d, n) { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function dmy(d) { if (!d) return '—'; const p = d.split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d; }
function dm(d) { if (!d) return '—'; const p = d.split('-'); return p.length === 3 ? p[2] + '/' + p[1] : d; }
function dowVi(d) { if (!d) return ''; return ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][new Date(d + 'T00:00:00Z').getUTCDay()]; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function initials(s) { const w = String(s || '?').trim().split(/\s+/); return ((w[0] || '?')[0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase(); }
function me() { return S.data.me; }
function isLeader() { return !!S.data.me.isLeader; }
function postById(id) { return S.data.posts.filter(function (p) { return p.id === id; })[0]; }
function stClass(s) { return ST_CLASS[s] || 'draft'; }
function chip(s) { return '<span class="st st-' + stClass(s) + '">' + esc(s) + '</span>'; }
function driveId(line) { const m = String(line).match(/[-\w]{25,}/); return m ? m[0] : ''; }
function mediaLines(p) { return String(p.media || '').split(/\n+/).map(function (s) { return s.trim(); }).filter(String); }
function isFolder(line) { return /\/folders\//.test(line); }
/* file lưu trên máy chủ của app: /media/xxxxxxxx.jpg */
function isOwn(line) { return /^\/media\/[a-f0-9]{16}\.[a-z0-9]{2,5}$/i.test(String(line || '').trim()); }
function extVideo(line) { return /\.(mp4|mov|webm|m4v|avi|mkv)$/i.test(String(line || '').trim()); }
function thumbUrl(line) {
  if (isOwn(line)) return isVideoUrl(line) ? '' : String(line).trim();
  const id = driveId(line); return id && !isFolder(line) ? 'https://drive.google.com/thumbnail?id=' + id + '&sz=w600' : '';
}
function userName(email) { const u = S.data.users.filter(function (x) { return x.email === email; })[0]; return u ? u.name : email; }
function canEdit(p) {
  if (isLeader()) return ['Đã đăng', 'Đã hẹn giờ'].indexOf(p.status) < 0;
  return p.authorEmail === me().email && ['Đang làm', 'Cần sửa'].indexOf(p.status) >= 0;
}
function sortPosts(list) { return list.slice().sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); }); }
function upsert(post) {
  const i = S.data.posts.findIndex(function (p) { return p.id === post.id; });
  if (i >= 0) S.data.posts[i] = post; else S.data.posts.push(post);
}

function toast(msg, err) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(function () { el.remove(); }, err ? 7000 : 3500);
}

function run(key, promise, ok) {
  S.busy = key; renderAll();
  return promise.then(function (res) { S.busy = ''; if (ok) ok(res); renderAll(); return res; })
    .catch(function (e) { S.busy = ''; renderAll(); toast(e.message || String(e), true); });
}
function busyBtn(key, label) { return S.busy === key ? '<span class="spin" aria-hidden="true"></span> Đang xử lý…' : label; }

/* ======================= ICONS ======================= */
const I = {
  overview: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  posts: '<path d="M4 5h16M4 12h16M4 19h10"/>',
  queue: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  settings: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  send: '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/>',
  upload: '<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',
  download: '<path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  left: '<path d="M15 6l-6 6 6 6"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  down: '<path d="M6 9l6 6 6-6"/>',
  up: '<path d="M6 15l6-6 6 6"/>',
  updown: '<path d="M8 9l4-4 4 4M8 15l4 4 4-4"/>',
  sync: '<path d="M20 11a8 8 0 0 0-14.6-4.6L4 8M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.6 4.6L20 16M20 20v-4h-4"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  play: '<path d="M8 5v14l11-7z" fill="currentColor"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'
};
function ic(name, size) { return '<svg width="' + (size || 18) + '" height="' + (size || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + I[name] + '</svg>'; }

/* ======================= KHUNG ======================= */
function renderAll() {
  if (!S.data) return;
  hidePeek();
  const keepScroll = window.scrollY;
  const wraps = Array.prototype.map.call(document.querySelectorAll('#app .sheet-wrap'), function (w) { return [w.scrollLeft, w.scrollTop]; });
  document.getElementById('app').innerHTML = shell();
  window.scrollTo(0, keepScroll);
  Array.prototype.forEach.call(document.querySelectorAll('#app .sheet-wrap'), function (w, i) { if (wraps[i]) { w.scrollLeft = wraps[i][0]; w.scrollTop = wraps[i][1]; } });
  renderDrawer();
  renderModal();
}

function pageIdsOf(p) { return String((p && p.pageId) || '').split(',').map(function (x) { return x.trim(); }).filter(function (x, i, a) { return x && a.indexOf(x) === i; }); }
function pageNameOf(id) { const pg = S.data.pages.filter(function (x) { return x.id === id; })[0]; return pg ? pg.name : id; }
function parseJ(s) { try { return s ? JSON.parse(s) : {}; } catch (e) { return {}; } }
function scoped() { return S.pageView ? S.data.posts.filter(function (p) { return pageIdsOf(p).indexOf(S.pageView) >= 0; }) : S.data.posts; }
function curPage() { return S.data.pages.filter(function (x) { return x.id === S.pageView; })[0]; }
function pageLabel() { const p = curPage(); return p ? p.name : 'Tất cả trang (' + S.data.pages.length + ')'; }
function num(n) { return Number(n || 0).toLocaleString('vi-VN'); }
function pct(a, b) { return b ? (a / b * 100).toFixed(1).replace('.', ',') + '%' : '—'; }
function nowHM() { return new Date(Date.now() + 7 * 3600e3).toISOString().slice(11, 16); }
function avatarStack(pages) {
  const show = pages.slice(0, 2), rest = pages.length - show.length;
  if (!pages.length) return '<span class="avs"><span class="av">?</span></span>';
  return '<span class="avs">' + show.map(function (p) { return '<span class="av">' + esc(initials(p.name)) + '</span>'; }).join('') + (rest > 0 ? '<span class="av more">+' + rest + '</span>' : '') + '</span>';
}
function tally(list) {
  const c = { total: list.length };
  ST_ORDER.forEach(function (s) { c[s] = 0; });
  list.forEach(function (p) { c[p.status] = (c[p.status] || 0) + 1; });
  c.done = c['Đã đăng'] + c['Đã hẹn giờ'];
  c.ready = c['Đã duyệt'] + c['Lỗi đăng'];
  return c;
}

function shell() {
  const posts = scoped();
  const pend = posts.filter(function (p) { return p.status === 'Chờ duyệt'; }).length;
  const toPost = posts.filter(function (p) { return p.status === 'Đã duyệt' || p.status === 'Lỗi đăng'; }).length;
  const myFix = posts.filter(function (p) { return p.authorEmail === me().email && p.status === 'Cần sửa'; }).length;
  const items = [
    ['overview', 'Tổng quan', ''],
    ['posts', 'Bài viết', ''],
    ['queue', isLeader() ? 'Duyệt & đăng' : 'Việc của tôi', isLeader() ? (pend + toPost || '') : (myFix || '')]
  ];
  if (isLeader()) items.push(['settings', 'Cài đặt', '']);
  const nav = items.map(function (it) {
    const extra = it[2] ? '<span class="badge">' + it[2] + '</span>' : '';
    return '<button type="button" data-act="nav" data-view="' + it[0] + '" class="' + (S.view === it[0] ? 'on' : '') + '" aria-current="' + (S.view === it[0] ? 'page' : 'false') + '">' + ic(it[0]) + '<span>' + it[1] + '</span>' + extra + '</button>';
  }).join('');
  const pages = S.data.pages;
  const cur = curPage();
  const opts = [['', 'Tất cả trang', 'Cộng gộp ' + pages.length + ' trang']].concat(pages.map(function (p) { return [p.id, p.name, p.enabled ? 'Đang dùng' : 'Đang ẩn với nhân viên']; }));
  const pick = '<div class="viewcard"><div class="vc-l">Chế độ xem</div>' +
    '<button type="button" class="pagepick" data-act="togglePageMenu" aria-haspopup="listbox" aria-expanded="' + !!S.pageMenu + '">' + avatarStack(cur ? [cur] : pages) +
    '<span class="pp-t"><b>' + esc(cur ? cur.name : 'Tất cả…') + '</b><span>' + (cur ? '1 trang' : pages.length + ' trang · số được cộng') + '</span></span>' + ic('down', 14) + '</button>' +
    (S.pageMenu ? '<div class="pmenu" role="listbox" aria-label="Chọn trang">' + opts.map(function (o) {
      return '<button type="button" role="option" aria-selected="' + (o[0] === S.pageView) + '" class="' + (o[0] === S.pageView ? 'on' : '') + '" data-act="pickPage" data-id="' + esc(o[0]) + '"><b>' + esc(o[1]) + '</b><span>' + esc(o[2]) + '</span></button>';
    }).join('') + '</div>' : '') + '</div>';
  const failed = S.data.posts.filter(function (p) { return p.status === 'Lỗi đăng'; }).length;
  const status = '<div class="statuscard"><div><span class="dot" style="background:' + (failed ? '#E8590C' : '#2F9E44') + '"></span><b>' + (failed ? failed + ' bài đăng lỗi' : 'Đồng bộ lúc ' + esc(S.syncedAt)) + '</b></div>' +
    '<span>' + (failed ? 'Đồng bộ lúc ' + esc(S.syncedAt) + ' · xem ở Duyệt & đăng' : esc(me().name) + ' · ' + esc(me().role)) + '</span>' +
    '<span><a href="#" data-act="logout">Đăng xuất ' + esc(me().email) + '</a></span></div>';
  return '<div class="shell"><aside class="side">' +
    '<div class="brand"><div class="logo">HC</div><div><b>Himen Content</b><span>' + pages.length + ' trang đang kết nối</span></div></div>' +
    pick + '<nav class="nav" aria-label="Menu chính">' + nav + '</nav>' + status +
    '</aside><main class="main">' + view() + '</main></div>';
}

function topbar(title, sub, right, noDefault) {
  return '<div class="topbar"><div><h1>' + title + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div><div class="actions">' + (right || '') +
    (noDefault ? '' : '<button type="button" class="btn" data-act="sync">' + busyBtn('sync', ic('sync', 16) + 'Đồng bộ ngay') + '</button>' +
    '<button type="button" class="btn primary" data-act="new">' + ic('plus', 16) + 'Viết bài mới</button>') + '</div></div>';
}

function view() {
  switch (S.view) {
    case 'posts': return postsView();
    case 'queue': return queueView();
    case 'settings': return isLeader() ? settingsView() : overviewView();
    default: return overviewView();
  }
}

/* ======================= TỔNG QUAN ======================= */
const RANGES = [['next7', '7 ngày tới'], ['thisMonth', 'Tháng này'], ['nextMonth', 'Tháng sau'], ['past7', '7 ngày gần nhất'], ['past30', '30 ngày gần nhất']];
function rangeOf(k) {
  const t = todayTH();
  let a, b;
  if (k === 'past7') { a = addDays(t, -6); b = t; }
  else if (k === 'next7') { a = t; b = addDays(t, 6); }
  else if (k === 'past30') { a = addDays(t, -29); b = t; }
  else {
    let m = monthOf(t);
    if (k === 'nextMonth') { const d = new Date(m + '-01T00:00:00Z'); d.setUTCMonth(d.getUTCMonth() + 1); m = d.toISOString().slice(0, 7); }
    a = m + '-01';
    const e = new Date(a + 'T00:00:00Z'); e.setUTCMonth(e.getUTCMonth() + 1); e.setUTCDate(0);
    b = e.toISOString().slice(0, 10);
  }
  return { from: a, to: b, days: Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5) + 1 };
}
function rangeSelect() {
  return '<select class="select" data-filter="range" aria-label="Khoảng thời gian" style="width:auto;min-width:180px">' +
    RANGES.map(function (r) { return '<option value="' + r[0] + '"' + (S.filters.range === r[0] ? ' selected' : '') + '>' + r[1] + '</option>'; }).join('') + '</select>';
}
function inRange(p, r) { return p.date >= r.from && p.date <= r.to; }
function subLine(r) { return esc(pageLabel()) + ' · ' + dmy(r.from) + ' – ' + dmy(r.to) + ' · ' + r.days + ' ngày'; }
function monthInput(val, key) {
  return '<input type="month" class="input" style="width:auto;min-width:160px" value="' + esc(val) + '" data-filter="' + key + '" aria-label="Tháng">';
}
function kpi(label, n, side, sub) {
  return '<div class="kpi"><div class="kpi-l">' + label + '</div><div class="kpi-n' + (String(n).length > 9 ? ' long' : '') + '">' + n + (side ? '<span class="kpi-s">' + side + '</span>' : '') + '</div><div class="kpi-sub">' + sub + '</div></div>';
}
function infoIc(tip) { return '<span class="tip" title="' + esc(tip) + '">' + ic('info', 13) + '</span>'; }

function overviewView() {
  const r = rangeOf(S.filters.range);
  const list = scoped().filter(function (p) { return inRange(p, r); });
  const c = tally(list);
  const all = scoped();
  const count = function (fn) { return all.filter(fn).length; };
  const parts = [];
  if (isLeader()) {
    const pend = count(function (p) { return p.status === 'Chờ duyệt'; });
    const ready = count(function (p) { return p.status === 'Đã duyệt'; });
    const failed = count(function (p) { return p.status === 'Lỗi đăng'; });
    if (pend) parts.push(pend + ' bài chờ duyệt');
    if (ready) parts.push(ready + ' bài đã duyệt nhưng chưa đăng');
    if (failed) parts.push(failed + ' bài đăng lỗi');
  } else {
    const fix = count(function (p) { return p.authorEmail === me().email && p.status === 'Cần sửa'; });
    const draft = count(function (p) { return p.authorEmail === me().email && p.status === 'Đang làm'; });
    if (fix) parts.push(fix + ' bài leader trả lại cần sửa');
    if (draft) parts.push(draft + ' bài đang viết dở');
  }
  const warn = parts.length ? '<div class="banner warn"><div>' + parts.join(' · ') + '.</div><button type="button" class="btn sm" data-act="nav" data-view="queue">' + (isLeader() ? 'Xử lý ngay' : 'Xem bài của tôi') + '</button></div>' : '';
  const kpis = '<div class="kpis">' +
    kpi('Bài trong kỳ', num(c.total), '', 'Tính trên ' + r.days + ' ngày') +
    kpi('Chờ duyệt', num(c['Chờ duyệt']), c.total ? pct(c['Chờ duyệt'], c.total) + ' tổng bài' : '', '= Nhân viên đã gửi, leader chưa duyệt') +
    kpi('Cần sửa', num(c['Cần sửa']), '', '= Leader trả lại, chờ nhân viên sửa') +
    kpi('Đã đăng / hẹn giờ', num(c.done), '', 'Trong đó ' + c['Đã hẹn giờ'] + ' bài hẹn giờ · còn ' + c.ready + ' bài chờ đăng') +
    kpi('Tỉ lệ hoàn tất', pct(c.done, c.total), '', '= Đã đăng / hẹn giờ ÷ Bài trong kỳ') + '</div>';
  return topbar('Tổng quan', subLine(r), rangeSelect()) + warn + kpis + dailyTable(r) + peopleCard(r);
}

const DAY_COLS = [
  ['date', 'Ngày', 'Ngày đăng theo giờ Thái'], ['pages', 'Trang', 'Số Fanpage có bài trong ngày'], ['total', 'Tổng bài', 'Tất cả bài lên lịch trong ngày'],
  ['Đang làm', 'Đang làm', 'Nhân viên đang viết, chưa gửi'], ['Chờ duyệt', 'Chờ duyệt', 'Đã gửi, chờ leader duyệt'], ['Cần sửa', 'Cần sửa', 'Leader trả lại'],
  ['ready', 'Chờ đăng', 'Đã duyệt nhưng chưa đăng, gồm bài đăng lỗi'], ['done', 'Đã đăng / hẹn', 'Đã đăng và đã hẹn giờ trên Facebook']
];
function sortHead(cols) {
  return '<tr><th style="width:36px"></th>' + cols.map(function (col, i) {
    const on = S.sort.key === col[0];
    return '<th class="' + (i ? 'num' : '') + '"><span class="h">' +
      '<button type="button" class="th-btn" data-act="sort" data-key="' + esc(col[0]) + '" aria-label="Sắp xếp theo ' + esc(col[1]) + '">' + esc(col[1]) + '</button>' + infoIc(col[2]) +
      '<button type="button" class="th-btn sorter' + (on ? ' on' : '') + '" data-act="sort" data-key="' + esc(col[0]) + '" aria-label="Đảo thứ tự">' + ic(on ? (S.sort.dir > 0 ? 'up' : 'down') : 'updown', 13) + '</button></span></th>';
  }).join('') + '</tr>';
}
function dailyTable(r) {
  const today = todayTH();
  const rows = [];
  for (let d = r.from; d <= r.to; d = addDays(d, 1)) {
    const ps = scoped().filter(function (p) { return p.date === d; });
    const c = tally(ps);
    c.date = d;
    c.pages = [].concat.apply([], ps.map(pageIdsOf)).filter(function (v, i, a) { return a.indexOf(v) === i; }).length;
    c.posts = sortPosts(ps);
    rows.push(c);
  }
  const k = S.sort.key, dir = S.sort.dir;
  rows.sort(function (a, b) { const x = a[k], y = b[k]; return (x < y ? -1 : x > y ? 1 : 0) * dir || (a.date < b.date ? -1 : 1); });
  const body = rows.map(function (c) {
    const open = !!S.expanded[c.date] && c.total > 0;
    const zero = !c.total;
    let h = '<tr class="' + (zero ? 'zero' : '') + '"><td>' + (c.total ? '<button type="button" class="caret' + (open ? ' open' : '') + '" data-act="toggleDay" data-d="' + c.date + '" aria-expanded="' + open + '" aria-label="Xem bài ngày ' + dmy(c.date) + '">' + ic('right', 14) + '</button>' : '') + '</td>' +
      '<td style="white-space:nowrap">' + dowVi(c.date) + ' ' + dmy(c.date) + (c.date === today ? '<span class="tag-soft">hôm nay</span>' : '') + '</td>' +
      '<td class="num">' + (c.pages ? c.pages + ' trang' : '—') + '</td>' +
      ['total', 'Đang làm', 'Chờ duyệt', 'Cần sửa', 'ready', 'done'].map(function (key) { return '<td class="num">' + num(c[key]) + '</td>'; }).join('') + '</tr>';
    if (open) h += '<tr class="sub"><td></td><td colspan="' + DAY_COLS.length + '">' + miniList(c.posts, '') + '</td></tr>';
    return h;
  }).join('');
  const sheetUrl = S.data.settings.sheetUrl;
  return '<div class="card"><div class="card-h rep-h"><h2>Báo cáo theo ngày · bấm ' + ic('right', 14) + ' để xem từng bài</h2>' +
    (sheetUrl ? '<a class="link" href="' + esc(sheetUrl) + '" target="_blank" rel="noopener">Mở Google Sheet ' + ic('ext', 14) + '</a>' : '') + '</div>' +
    '<div class="scroll"><table class="t rep"><thead>' + sortHead(DAY_COLS) + '</thead><tbody>' + body + '</tbody></table></div></div>';
}

/* ======================= NHÂN VIÊN ======================= */
function peopleCard(r) {
  const list = scoped().filter(function (p) { return inRange(p, r); });
  const people = S.data.users.filter(function (u) { return u.active; });
  const rows = people.map(function (u) {
    const c = tally(list.filter(function (p) { return p.authorEmail === u.email; }));
    const rate = c.total ? Math.round(c.done / c.total * 100) : 0;
    return '<tr><td><span class="who-cell"><span class="av solo">' + esc(initials(u.name)) + '</span><span><b>' + esc(u.name) + '</b><span class="hint" style="display:block;margin:0">' + esc(u.role) + '</span></span></span></td>' +
      '<td class="num">' + num(c.total) + '</td><td class="num">' + num(c['Đang làm']) + '</td><td class="num">' + num(c['Chờ duyệt']) + '</td><td class="num">' + num(c['Cần sửa']) + '</td><td class="num">' + num(c.ready) + '</td><td class="num">' + num(c.done) + '</td>' +
      '<td><div style="display:flex;align-items:center;gap:10px"><div class="bar" style="flex:1"><i style="width:' + rate + '%"></i></div><b style="min-width:56px;text-align:right">' + (c.total ? pct(c.done, c.total) : '—') + '</b></div></td>' +
      '<td><button type="button" class="btn sm" data-act="personPosts" data-email="' + esc(u.email) + '">Xem bài</button></td></tr>';
  }).join('');
  return '<div class="card" style="margin-top:16px"><div class="card-h rep-h"><h2>Tiến độ theo nhân viên</h2><span class="hint" style="margin:0">Hoàn tất = đã đăng + đã hẹn giờ</span></div><div class="scroll"><table class="t rep"><thead><tr><th>Nhân viên</th><th class="num">Tổng bài</th><th class="num">Đang làm</th><th class="num">Chờ duyệt</th><th class="num">Cần sửa</th><th class="num">Chờ đăng</th><th class="num">Đã đăng / hẹn</th><th style="min-width:180px">Tỉ lệ hoàn tất</th><th></th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="9" class="empty">Chưa có nhân viên.</td></tr>') + '</tbody></table></div></div>';
}

function miniList(list, emptyText) {
  if (!list.length) return '<div class="empty">' + emptyText + '</div>';
  return '<div class="list">' + list.map(function (p) {
    return '<button type="button" class="row mini" style="grid-template-columns:minmax(0,1fr) auto" data-act="open" data-id="' + esc(p.id) + '">' +
      '<div class="ttl"><b>' + esc(p.slogan || p.angle || p.topic || '(Chưa có tiêu đề)') + '</b><span>' + dm(p.date) + ' ' + esc(p.time) + ' · ' + esc(p.pageName || 'Chưa chọn Page') + ' · ' + esc(p.authorName) + '</span></div>' +
      '<div class="stc">' + chip(p.status) + '</div></button>';
  }).join('') + '</div>';
}

/* ======================= DANH SÁCH BÀI ======================= */
function filteredPosts() {
  const f = S.filters, q = f.q.trim().toLowerCase();
  return sortPosts(scoped().filter(function (p) {
    if (f.month && monthOf(p.date) !== f.month && p.date) return false;
    if (f.author && p.authorEmail !== f.author) return false;
    if (f.page && p.pageId !== f.page) return false;
    if (f.status && p.status !== f.status) return false;
    if (q && [p.slogan, p.contentVi, p.contentTh, p.angle, p.topic, p.authorName].join(' ').toLowerCase().indexOf(q) < 0) return false;
    return true;
  }));
}

function postList(list, emptyText) {
  if (!list.length) return '<div class="empty">' + emptyText + '</div>';
  return '<div class="list-head"><span>Ngày giờ (TH)</span><span>Fanpage</span><span>Bài viết</span><span>Người viết</span><span>Trạng thái</span></div><div class="list">' +
    list.map(function (p) {
      return '<button type="button" class="row" data-act="open" data-id="' + esc(p.id) + '">' +
        '<div class="when"><b>' + dowVi(p.date) + ' ' + dm(p.date) + '</b><span>' + esc(p.time || '—') + '</span></div>' +
        '<div class="page">' + esc(p.pageName || 'Chưa chọn Page') + '</div>' +
        '<div class="ttl"><b>' + esc(p.slogan || p.angle || '(Chưa có slogan)') + '</b><span>' + esc([p.topic, p.format, p.goal].filter(String).join(' · ')) + '</span></div>' +
        '<div class="who">' + esc(p.authorName) + '</div>' +
        '<div class="stc">' + chip(p.status) + '</div></button>';
    }).join('') + '</div>';
}

function selectOpts(list, val, all) {
  return '<option value="">' + all + '</option>' + list.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('');
}

function modeToggle() {
  const m = S.postsMode || 'table';
  return '<div class="seg" role="group" aria-label="Kiểu xem">' + [['table', 'Bảng tổng'], ['list', 'Danh sách'], ['calendar', 'Lịch']].map(function (o) {

function postsView() {

    '<select class="select" data-filter="status" aria-label="Trạng thái">' + selectOpts(ST_ORDER.map(function (s) { return [s, s]; }), f.status, 'Tất cả trạng thái') + '</select>' +
    '<input class="input" type="search" placeholder="Tìm slogan, nội dung…" value="' + esc(f.q) + '" data-filter="q" aria-label="Tìm kiếm">' +
    '</div>' + ((S.postsMode || 'table') === 'table' ? sheetTable(list) : '<div class="card">' + postList(list, 'Không có bài nào khớp bộ lọc.') + '</div>');

/* Bảng tổng: đủ các cột như file Google Sheet, mỗi ngày một màu nền */
const SHEET_BANDS = ['#FCEBEA', '#FFF6DB', '#EAF4EA', '#FFFFFF', '#F1F2F5'];
const SHEET_COLS = [
  ['Ngày', 132], ['Giờ (TH)', 74], ['Fanpage', 140], ['Người viết', 104], ['Mục tiêu', 100], ['Chủ đề (trụ cột)', 196], ['Format', 112],
  ['Angles (góc khai thác)', 210], ['Slogan', 200], ['Content tiếng Việt', 320], ['Content tiếng Thái (đăng FB)', 320], ['Hình/video', 132], ['Bình luận của Page', 240],
  ['Link bài viết', 104], ['Chạy Ads?', 86], ['Kết quả sau Ads', 170], ['Ghi chú / tối ưu', 240], ['Nhận xét đánh giá', 230], ['Trạng thái', 124]
];
function clampCell(text, cls) {
  return text ? '<div class="clamp' + (cls ? ' ' + cls : '') + '">' + esc(text) + '</div>' : '<span class="muted">—</span>';
}
function sheetTable(list) {
  if (!list.length) return '<div class="card"><div class="empty">Không có bài nào khớp bộ lọc.</div></div>';
  const dates = [];
  list.forEach(function (p) { if (dates.indexOf(p.date) < 0) dates.push(p.date); });
  const width = SHEET_COLS.reduce(function (a, c) { return a + c[1]; }, 0);
  const allSel = list.length && list.every(function (p) { return S.sel[p.id]; });
  const head = '<tr>' + SHEET_COLS.map(function (c, i) {
    return '<th style="width:' + c[1] + 'px"' + (i === 0 ? ' class="stick"' : '') + '>' + (i === 0 ? '<label class="selbox" data-noopen><input type="checkbox" data-sel-all' + (allSel ? ' checked' : '') + ' aria-label="Chọn tất cả bài đang hiện"></label>' : '') + esc(c[0]) + '</th>';
  }).join('') + '</tr>';
  const body = list.map(function (p) {
    const band = SHEET_BANDS[Math.max(0, dates.indexOf(p.date)) % SHEET_BANDS.length];
    const media = mediaLines(p);

function actionButtons(p, compact) {
  const b = [];

  if ((mine || isLeader()) && (p.status === 'Đang làm' || p.status === 'Cần sửa')) b.push('<button type="button" class="btn blue" data-act="submit" data-id="' + p.id + '">' + busyBtn('submit' + p.id, ic('send', 16) + 'Gửi duyệt') + '</button>');
  if (isLeader() && p.status === 'Chờ duyệt') {
    b.push('<button type="button" class="btn blue" data-act="approve" data-id="' + p.id + '">Duyệt</button>');
    b.push('<button type="button" class="btn" data-act="return" data-id="' + p.id + '">Trả lại sửa</button>');
  }
  if ((isLeader() || mine) && (p.status === 'Đã duyệt' || p.status === 'Lỗi đăng')) {
    b.push('<button type="button" class="btn primary" data-act="publish" data-id="' + p.id + '">' + ic('send', 16) + (p.status === 'Lỗi đăng' ? 'Thử đăng lại' : 'Đăng lên FB') + '</button>');
  }
  if (isLeader() && (p.status === 'Đã duyệt' || p.status === 'Lỗi đăng')) {
    b.push('<button type="button" class="btn" data-act="return" data-id="' + p.id + '">Trả lại sửa</button>');
    if (!compact) b.push('<button type="button" class="btn" data-act="markPosted" data-id="' + p.id + '">Đánh dấu đã đăng tay</button>');
  }
  if (isLeader() && p.status === 'Đã hẹn giờ') {
    b.push('<button type="button" class="btn" data-act="cancelSchedule" data-id="' + p.id + '">' + busyBtn('cancel' + p.id, 'Hủy hẹn giờ') + '</button>');
    if (!compact) b.push('<button type="button" class="btn" data-act="markPosted" data-id="' + p.id + '">Đánh dấu đã đăng</button>');
  }
  if (p.link) b.push('<a class="btn" href="' + esc(p.link) + '" target="_blank" rel="noopener">' + ic('ext', 16) + 'Xem bài trên FB</a>');
  if (canEdit(p)) b.push('<button type="button" class="btn" data-act="edit" data-id="' + p.id + '">Sửa</button>');
  if (compact) b.push('<button type="button" class="btn" data-act="open" data-id="' + p.id + '">Chi tiết</button>');
  return b.join('');
}

/* ======================= LỊCH ======================= */
function calendarView() {
  const m = S.calMonth;
  const first = m + '-01';
  const startDow = (new Date(first + 'T00:00:00Z').getUTCDay() + 6) % 7;
  const start = addDays(first, -startDow);
  const today = todayTH();
  const byDay = {};
  scoped().forEach(function (p) { if (p.date) (byDay[p.date] = byDay[p.date] || []).push(p); });
  Object.keys(byDay).forEach(function (k) { byDay[k] = sortPosts(byDay[k]); });
  let cells = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    if (i >= 35 && monthOf(d) !== m) break;
    const ps = byDay[d] || [];
    const pills = ps.slice(0, 4).map(function (p) {
      const c = stClass(p.status);
      return '<button type="button" class="pill st-' + c + '" data-act="open" data-id="' + esc(p.id) + '" title="' + esc(p.status + ' · ' + (p.slogan || p.topic)) + '">' + esc(p.time) + ' ' + esc(p.slogan || p.topic || p.pageName) + '</button>';
    }).join('');
    cells += '<div class="day' + (monthOf(d) !== m ? ' out' : '') + (d === today ? ' today' : '') + '"><span class="dn">' + Number(d.slice(8)) + '</span>' + pills + (ps.length > 4 ? '<span class="more">+' + (ps.length - 4) + ' bài</span>' : '') + '</div>';
  }
  const monthPosts = sortPosts(scoped().filter(function (p) { return monthOf(p.date) === m; }));
  const days = [];
  monthPosts.forEach(function (p) { if (days.indexOf(p.date) < 0) days.push(p.date); });
  const agenda = days.length ? days.map(function (d) {
    return '<div class="card-h" style="background:var(--soft)"><h2>' + dowVi(d) + ' ' + dmy(d) + '</h2></div>' + miniList(byDay[d], '');
  }).join('') : '<div class="empty">Tháng này chưa có bài.</div>';
  const label = 'Tháng ' + Number(m.slice(5)) + '/' + m.slice(0, 4);
  return topbar('Bài viết', esc(pageLabel()) + ' · lịch theo tháng, màu theo trạng thái', modeToggle() +
    '<button type="button" class="icon-btn" data-act="calPrev" aria-label="Tháng trước">' + ic('left') + '</button><b style="min-width:110px;text-align:center">' + label + '</b><button type="button" class="icon-btn" data-act="calNext" aria-label="Tháng sau">' + ic('right') + '</button>') +
    '<div class="card" style="overflow:hidden"><div class="cal">' + cells + '</div><div class="agenda">' + agenda + '</div></div>' +
    '<div class="meta" style="margin-top:12px">' + ST_ORDER.map(function (s) { return chip(s); }).join('') + '</div>';
}

/* ======================= QUẢNG CÁO (ghi tay trong chi tiết bài) ======================= */
function money(v, cur) {
  if (!cur || cur === 'VND') return num(Math.round(v)) + ' ₫';
  return Number(v || 0).toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + ' ' + cur;
}
function pct2(v) { return (v * 100).toFixed(2).replace('.', ',') + '%'; }
function adsData(p) { try { return p.adsData ? JSON.parse(p.adsData) : null; } catch (e) { return null; } }
function adsDrawerCard(p) {
  const a = adsData(p);
  const cur = a ? a.currency : 'VND';
  const auto = a ? '<div class="kv" style="margin-bottom:6px">' + [['Số quảng cáo', num(a.ads)], ['Đã chi', money(a.spend, cur)], ['Bắt đầu trò chuyện', num(a.conversations)], ['Bình luận', num(a.comments)],
    ['Lượt mua', num(a.purchases)], ['Giá trị chuyển đổi', money(a.value, cur)], ['% ADS', a.value ? pct2(a.spend / a.value) : '—'], ['Tỷ lệ chốt', a.conversations + a.comments ? pct2(a.purchases / (a.conversations + a.comments)) : '—']]
    .map(function (x) { return '<div><span>' + x[0] + '</span><b>' + x[1] + '</b></div>'; }).join('') + '</div>' : '';
  return '<div class="card"><div class="card-h"><h2>Quảng cáo</h2><span class="hint" style="margin:0">' + (p.adsSyncedAt ? 'Đồng bộ lúc ' + esc(p.adsSyncedAt) : 'Ghi tay') + '</span></div><div class="card-b" style="display:flex;flex-direction:column;gap:10px">' + auto +

    '<div><button type="button" class="btn" data-act="saveAds" data-id="' + p.id + '">' + busyBtn('ads', 'Lưu') + '</button></div></div></div>';
}

function fbComments(p, page) {
  const list = cmList(p).filter(function (c) { return (c.text || '').trim() || c.media; });

  }).join('') + '</div>';

function fbPreview(p) {
  const tags = String(p.hashtags || '').trim();
  const parts = [];
  if (p.slogan) parts.push('<span class="slogan">' + esc(p.slogan) + '</span>');
  if (p.contentTh) parts.push(esc(p.contentTh));
  if (p.cta) parts.push(esc(p.cta));
  if (tags) parts.push('<span class="tag">' + esc(tags) + '</span>');
  const msg = parts.length ? parts.join('\n\n') : '<span style="color:#8A8D91">Nội dung tiếng Thái sẽ hiện ở đây.</span>';
  const lines = mediaLines(p);
  let media = '';

    media = videoBlock(p);

    const n = Math.min(lines.length, 4);
    media = '<div class="fb-img n' + n + '">' + lines.slice(0, 4).map(function (l, i) {
      const u = thumbUrl(l);

      return '<div class="ph">' + (isFolder(l) ? 'Thư mục Drive' : 'Ảnh/video') + (u ? '<img src="' + esc(u) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + extra + '</div>';
    }).join('') + '</div>';
  }

    '<div class="fb-msg th">' + msg + '</div>' + media +
    '<div class="fb-f"><span>Thích</span><span>Bình luận</span><span>Chia sẻ</span></div>' + fbComments(p, page) + '</div>';

/* ---------- xem trước video ---------- */
function videoLine(p) { const l = mediaLines(p).filter(function (x) { return !isFolder(x); }); return l.filter(isVideoUrl)[0] || l[0] || ''; }
function driveEmbed(id) { return id ? 'https://drive.google.com/file/d/' + id + '/preview' : ''; }
/* video có thể phát ngay: file vừa chọn trên máy hoặc file đã lưu trên máy chủ */
function playableSrc(v) { return (S.localVideo || {})[v] || (isOwn(v) ? v : ''); }
function videoBlock(p) {
  const v = videoLine(p), id = isOwn(v) ? '' : driveId(v), key = id || v;
  const tall = p.format === 'Reels' || p.format === 'Story';
  const poster = p.thumb ? thumbUrl(p.thumb) : '';
  const local = playableSrc(v);
  if (local) return '<div class="fb-video' + (tall ? ' tall' : '') + '" data-vkey="' + esc(key) + '"><video controls playsinline preload="metadata"' + (poster ? ' poster="' + esc(poster) + '"' : '') + ' src="' + esc(local) + '"></video></div>';
  if (id && (S.playing || {})[id]) return '<div class="fb-video' + (tall ? ' tall' : '') + '" data-vkey="' + esc(key) + '"><iframe src="' + esc(driveEmbed(id)) + '" allow="autoplay; fullscreen" allowfullscreen title="Xem video"></iframe></div>';
  const tu = poster || thumbUrl(v);
  return '<div class="fb-img n1"><button type="button" class="ph vbtn" style="aspect-ratio:' + (tall ? '9/16' : '16/9') + '" data-act="playVideo" data-id="' + esc(id) + '" aria-label="Xem video">' +
    (tu ? '<img src="' + esc(tu) + '" alt="" loading="lazy" onerror="this.remove()">' : '') + '<span class="vplay">' + ic('play', 26) + '</span></button></div>';
}
/* cập nhật xem trước mà không làm video đang phát bị tải lại */
function patchPreview(pv, html) {
  const old = pv.querySelector('[data-vkey]');
  const t = document.createElement('div'); t.innerHTML = html;
  const nw = t.querySelector('[data-vkey]');
  const oc = pv.firstElementChild, nc = t.firstElementChild;
  if (!old || !nw || old.dataset.vkey !== nw.dataset.vkey || !oc || !nc) { pv.innerHTML = html; return; }
  Array.prototype.slice.call(oc.children).forEach(function (c) { if (c !== old) c.remove(); });
  let before = true;
  Array.prototype.slice.call(nc.children).forEach(function (c) {
    if (c === nw) { before = false; return; }
    if (before) oc.insertBefore(c, old); else oc.appendChild(c);
  });
  oc.className = nc.className;
}

function initThumbModal() {
  const v = document.getElementById('tv'), seek = document.getElementById('tv-seek'), strip = document.getElementById('tv-strip');
  if (!v || !seek) return;
  v.addEventListener('loadedmetadata', function () { v.currentTime = Math.min(0.1, v.duration || 0); buildStrip(v.src, v.duration, strip, seek, v); });
  seek.addEventListener('input', function () { if (v.duration) v.currentTime = v.duration * seek.value / 1000; });
}
function buildStrip(src, dur, strip, seek, main) {
  if (!dur || !strip) return;
  const n = 8, h = document.createElement('video');
  h.muted = true; h.preload = 'auto'; h.src = src;
  let i = 0;
  function grab() {
    const c = document.createElement('canvas'); c.width = 96; c.height = Math.round(96 * (h.videoHeight || 9) / (h.videoWidth || 16));
    try { c.getContext('2d').drawImage(h, 0, 0, c.width, c.height); } catch (e) { return; }
    const b = document.createElement('button'); b.type = 'button'; b.className = 'tv-frame'; b.setAttribute('aria-label', 'Khung hình ' + (i + 1));
    const t = h.currentTime; b.appendChild(c);
    b.addEventListener('click', function () { main.currentTime = t; seek.value = Math.round(t / dur * 1000); });
    strip.appendChild(b);
    i++; if (i < n) h.currentTime = dur * (i + 0.5) / n;
  }
  h.addEventListener('seeked', grab);
  h.addEventListener('loadeddata', function () { h.currentTime = dur * 0.5 / n; });
}

    body = '<h3>' + esc(md.title) + '</h3>' + (md.text ? '<p style="margin:0;color:var(--ink2)">' + esc(md.text) + '</p>' : '') +
      '<div class="actions" style="justify-content:flex-end"><button type="button" class="btn" data-act="modalClose">Hủy</button><button type="button" class="btn ' + (md.danger ? 'danger' : 'primary') + '" data-act="doConfirm">' + busyBtn('modal', esc(md.ok || 'Đồng ý')) + '</button></div>';
  } else if (md.type === 'delete') {
    body = '<h3>Xóa bài này?</h3><p style="margin:0">' + esc(p.slogan || p.topic || p.id) + '</p><p class="hint" style="margin:0">Không khôi phục được.</p>' +

  }
  root.innerHTML = '<div class="modal-wrap" data-act="modalBg"><div class="modal' + (md.type === 'thumb' ? ' wide' : '') + '" role="dialog" aria-modal="true">' + body + '</div></div>';
  if (md.type === 'thumb') { initThumbModal(); return; }
  const first = root.querySelector('textarea,input.input');
  if (first && !S.busy) first.focus();
}

function newDraft() {

  return { id: '', pageId: enabled.length === 1 ? enabled[0].id : '', date: addDays(todayTH(), 1), time: '19:00', goal: '', topic: '', format: '', angle: '', slogan: '',
    contentVi: '', contentTh: '', hashtags: '', cta: '', media: '', note: '', comments: '', publishMode: 'schedule', thumb: '', status: 'Đang làm' };

function saveEditing(thenSubmit) {
  const e = S.editing;
  const payload = {};
  ['id', 'pageId', 'date', 'time', 'goal', 'topic', 'format', 'angle', 'slogan', 'contentVi', 'contentTh', 'hashtags', 'cta', 'media', 'note', 'comments', 'publishMode', 'thumb', 'spacing', 'channels', 'contentIg', 'contentThreads', 'adCopy'].forEach(function (k) { payload[k] = e[k] || ''; });

document.addEventListener('click', function (ev) {

  if (el.dataset.act === 'closeOverlay' || el.dataset.act === 'modalBg') { ACT[el.dataset.act](el, ev); return; }
  ev.preventDefault();

document.addEventListener('input', function (ev) {
  const el = ev.target;
  if (el.dataset.field && S.editing && el.tagName !== 'SELECT') { S.editing[el.dataset.field] = el.value; refreshLive(); }
  if (el.dataset && el.dataset.cmText !== undefined && S.editing) {
    const a = cmList(S.editing), i = Number(el.dataset.cmText);
    if (a[i]) { a[i].text = el.value; setCm(a); refreshLive(); }
    return;
  }
  if (el.hasAttribute && (el.hasAttribute('data-pagesearch') || el.hasAttribute('data-pagefilter'))) {
    const attr = el.hasAttribute('data-pagesearch') ? 'data-pagesearch' : 'data-pagefilter';
    const pos = el.selectionStart;
    if (attr === 'data-pagesearch') { S.pageSearch = el.value; renderDrawer(); } else { S.pageFilter = el.value; renderAll(); }
    const n = document.querySelector('[' + attr + ']');
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* search input */ } }
    return;
  }
  if (el.dataset.filter === 'q') { S.filters.q = el.value; const pos = el.selectionStart; renderAll(); const n = document.querySelector('[data-filter="q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
});

document.addEventListener('change', function (ev) {
  const el = ev.target;
  if (el.dataset.field && S.editing) {
    S.editing[el.dataset.field] = el.value;
    if (el.tagName === 'SELECT' || el.dataset.field === 'media') renderDrawer(); else refreshLive();
  }
  if (el.dataset.filter && el.dataset.filter !== 'q') { S.filters[el.dataset.filter] = el.value; renderAll(); }
  if (el.dataset.actChange === 'pickCta' && el.value !== '') {
    const t = S.data.options.tags.filter(function (x) { return x.ctaTh; })[Number(el.value)];
    if (t) { S.editing.cta = t.ctaTh; renderDrawer(); }
  }
  if (el.dataset.actChange === 'pubMode') { S.modal.mode = el.value; renderModal(); }
  if (el.dataset.actChange === 'upload') { uploadFiles(Array.prototype.slice.call(el.files)); el.value = ''; }
  if (el.dataset.userRole || el.dataset.userActive) {
    const email = el.dataset.userRole || el.dataset.userActive;
    const u = S.data.users.filter(function (x) { return x.email === email; })[0];
    const upd = { email: u.email, name: u.name, role: el.dataset.userRole ? el.value : u.role, active: el.dataset.userActive ? el.checked : u.active };
    run('user', api('api_saveUser', upd), function (users) { S.data.users = users; toast('Đã cập nhật ' + u.name + '.'); });
  }
  if (el.hasAttribute('data-pubmode') && S.editing) { S.editing.publishMode = el.value; renderDrawer(); return; }
  if (el.hasAttribute('data-thumb-upload') && el.files && el.files[0]) { const f = el.files[0]; if (!/^image\//.test(f.type)) { toast('Chọn file ảnh.', true); return; } saveThumbBlob(f, f.name); return; }
  if (el.dataset.cmMedia !== undefined && S.editing) {
    const a = cmList(S.editing), i = Number(el.dataset.cmMedia);
    if (a[i] && el.value.trim()) { a[i].media = el.value.trim().split(/\s+/)[0]; setCm(a); renderDrawer(); }
    return;
  }
  if (el.dataset.cmCta !== undefined && S.editing && el.value !== '') {
    const t = S.data.options.tags.filter(function (x) { return x.ctaTh; })[Number(el.value)];
    const a = cmList(S.editing), i = Number(el.dataset.cmCta);
    if (t && a[i]) { a[i].text = (a[i].text ? a[i].text.replace(/\s+$/, '') + '\n' : '') + t.ctaTh; setCm(a); renderDrawer(); }
    return;
  }
  if (el.dataset.cmUpload !== undefined && el.files && el.files[0]) { uploadCommentImage(el.files[0], Number(el.dataset.cmUpload)); return; }
  if (el.dataset.pickPage) {
    let ids = pageIdsOf(S.editing);
    if (el.checked) { if (ids.indexOf(el.dataset.pickPage) < 0) ids.push(el.dataset.pickPage); }
    else ids = ids.filter(function (x) { return x !== el.dataset.pickPage; });
    S.editing.pageId = ids.join(',');
    renderDrawer();
    return;
  }
  if (el.dataset.selPost) { S.sel[el.dataset.selPost] = el.checked; renderAll(); return; }
  if (el.hasAttribute('data-sel-all')) { const on = el.checked; S.sel = {}; if (on) filteredPosts().forEach(function (p) { S.sel[p.id] = true; }); renderAll(); return; }
  if (el.dataset.selPage) { S.selPages[el.dataset.selPage] = el.checked; renderAll(); return; }
  if (el.hasAttribute('data-sel-allpages')) {
    const on = el.checked, q = (S.pageFilter || '').trim().toLowerCase();
    S.selPages = {};
    if (on) S.data.pages.filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) >= 0; }).forEach(function (p) { S.selPages[p.id] = true; });
    renderAll(); return;
  }
  if (el.dataset.pageEnabled) {
    const id = el.dataset.pageEnabled, on = el.checked;
    run('page', api('api_setPageEnabled', id, on), function () { S.data.pages.forEach(function (p) { if (p.id === id) p.enabled = on; }); });
  }
});

function uploadFiles(files) {

  const queue = files.filter(function (f) {
    if (!/^(image|video)\//.test(f.type)) { toast(f.name + ': chỉ nhận ảnh hoặc video.', true); return false; }

    return true;
  });
  let i = 0;
  function next() {
    if (i >= queue.length) { S.uploading = ''; S.uploadPct = 0; renderDrawer(); refreshLive(); if (S.pendingThumb) { S.modal = { type: 'thumb', url: S.pendingThumb }; S.pendingThumb = ''; renderModal(); } return; }

      if (/^video\//.test(r.mimeType)) {

/* ======================= XEM NHANH Ô (rê chuột trong Bảng tổng) ======================= */
const PEEK = { el: null, timer: 0, hide: 0, cell: null };
function peekEl() {
  if (!PEEK.el) {
    PEEK.el = document.createElement('div');
    PEEK.el.className = 'peek';
    PEEK.el.setAttribute('role', 'tooltip');
    PEEK.el.hidden = true;
    PEEK.el.dataset.act = 'open';
    document.body.appendChild(PEEK.el);
    PEEK.el.addEventListener('mouseenter', function () { clearTimeout(PEEK.hide); });
    PEEK.el.addEventListener('mouseleave', hidePeekSoon);
  }
  return PEEK.el;
}
function hidePeek() { clearTimeout(PEEK.timer); clearTimeout(PEEK.hide); if (PEEK.el) PEEK.el.hidden = true; PEEK.cell = null; }
function hidePeekSoon() { clearTimeout(PEEK.timer); clearTimeout(PEEK.hide); PEEK.hide = setTimeout(hidePeek, 150); }
function showPeek(clamp) {
  const td = clamp.closest('td');
  const tr = td.closest('tr');
  const r = td.getBoundingClientRect();
  const el = peekEl();
  el.className = 'peek' + (clamp.classList.contains('th') ? ' th' : '') + (clamp.classList.contains('strong') ? ' strong' : '');
  el.textContent = clamp.textContent;
  el.dataset.id = tr ? tr.dataset.id : '';
  el.style.width = Math.min(Math.max(r.width + 60, 380), window.innerWidth - 24) + 'px';
  el.scrollTop = 0;
  el.hidden = false;
  let left = Math.min(r.left - 2, window.innerWidth - 12 - el.offsetWidth);
  let top = Math.min(r.top - 2, window.innerHeight - 12 - el.offsetHeight);
  el.style.left = Math.max(12, left) + 'px';
  el.style.top = Math.max(12, top) + 'px';
}
document.addEventListener('mouseover', function (ev) {
  if (!window.matchMedia('(hover: hover)').matches || !ev.target.closest) return;
  if (PEEK.el && PEEK.el.contains(ev.target)) { clearTimeout(PEEK.hide); return; }
  const td = ev.target.closest('table.sheet td');
  if (!td) return;
  if (td === PEEK.cell) { clearTimeout(PEEK.hide); return; }
  hidePeek();
  PEEK.cell = td;
  const clamp = td.querySelector('.clamp');
  if (!clamp || clamp.scrollHeight <= clamp.clientHeight + 1) return;
  PEEK.timer = setTimeout(function () { if (PEEK.cell === td) showPeek(clamp); }, 200);
});
document.addEventListener('mouseout', function (ev) {
  if (!ev.target.closest) return;
  const td = ev.target.closest('table.sheet td');
  if (!td) return;
  const to = ev.relatedTarget;
  if (to && (td.contains(to) || (PEEK.el && PEEK.el.contains(to)))) return;
  hidePeekSoon();
});
document.addEventListener('scroll', function (ev) { if (PEEK.el && ev.target !== PEEK.el) hidePeek(); }, true);
